[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/technolog-spectrumai/irena"

[workspace.dependencies]
prunella-canonical = { path = "crates/prunella-canonical" }
prunella-core = { path = "crates/prunella-core" }
prunella-crypto = { path = "crates/prunella-crypto" }
prunella-verify = { path = "crates/prunella-verify" }
prunella-store = { path = "crates/prunella-store" }
prunella-xml = { path = "crates/prunella-xml" }
bornite-core = { path = "crates/bornite-core" }
bornite-rules = { path = "crates/bornite-rules" }
bornite-eval = { path = "crates/bornite-eval" }
bornite-xml = { path = "crates/bornite-xml" }
irena-core = { path = "crates/irena-core" }
irena-ledger = { path = "crates/irena-ledger" }
irena-vote = { path = "crates/irena-vote" }
irena-meeting = { path = "crates/irena-meeting" }
irena-resolution = { path = "crates/irena-resolution" }
irena-cli = { path = "crates/irena-cli" }

base64 = "0.23"
blake3 = "1.8"
borsh = { version = "1.8", features = ["derive"] }
clap = { version = "4.6", features = ["derive", "env"] }
ed25519-dalek = "3.0"
getrandom = "0.4"
hex = "0.4"
proptest = "1.11"
quick-xml = "0.42"
rand_core = "0.10"
redb = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# No crate in this workspace may do floating-point arithmetic: a ledger and a voting
# engine must produce the same bytes on every machine, and floats do not.
float_arithmetic = "deny"

[profile.release]
overflow-checks = true
