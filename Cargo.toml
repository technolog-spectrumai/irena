[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/technolog-spectrumai/irena"

[workspace.dependencies]
prunella-canonical = { path = "crates/prunella-canonical" }
prunella-core = { path = "crates/prunella-core" }
prunella-crypto = { path = "crates/prunella-crypto" }
prunella-verify = { path = "crates/prunella-verify" }
prunella-store = { path = "crates/prunella-store" }
prunella-xml = { path = "crates/prunella-xml" }

base64 = "0.23"
blake3 = "1.8"
borsh = { version = "1.8", features = ["derive"] }
clap = { version = "4.6", features = ["derive", "env"] }
ed25519-dalek = "3.0"
hex = "0.4"
quick-xml = "0.42"
rand_core = "0.10"
redb = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
overflow-checks = true
